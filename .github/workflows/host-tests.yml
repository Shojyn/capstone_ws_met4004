name: Host tests

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes cmake ninja-build

      - name: Configure
        run: cmake -S src/wcs_controller/tests -B build/host-tests -G Ninja

      - name: Build
        run: cmake --build build/host-tests

      - name: Test
        run: ctest --test-dir build/host-tests --output-on-failure
